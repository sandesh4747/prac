<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Pig Game</title>
  </head>
  <body>
    <main>
      <div class="container container-1">
        <div class="player-score">
          <p class="player" id="player-0">PLAYER 1</p>
          <p class="score" id="score-0">18</p>
          <!-- <p class="win-loss"></p> -->
        </div>

        <div class="currentScore">
          <p>CURRENT</p>
          <p id="current-score-0">0</p>
        </div>
      </div>
      <div class="container container-2">
        <div class="player-score">
          <p class="player" id="player-1">PLAYER 2</p>
          <p class="score" id="score-1">1</p>
          <!-- <p class="win-loss"></p> -->
        </div>

        <div class="currentScore">
          <p>CURRENT</p>
          <p id="current-score-1">0</p>
        </div>
      </div>

      <img class="img" src="img/dice-1.png" alt=" image of dice" />
      <button class="btn btn-new">NEW GAME</button>
      <button class="btn btn-roll">ROLL DICE</button>
      <button class="btn btn-hold">HOLD</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
